<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout-memo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>Workout-memo</h1>
  </header>

  <main class="app-content">
    <!-- 📅 カレンダー画面 -->
    <section id="view-calendar" class="view-section active">
      <div class="calendar-header">
        <button id="prev-month">&lt;</button>
        <h2 id="current-month-year"></h2>
        <button id="next-month">&gt;</button>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>

      <div class="day-details">
        <div class="details-header">
          <h3 id="selected-date-text">日付を選択してください</h3>
          <button id="btn-copy-memo" class="btn-copy">📋 記録をコピー</button>
        </div>
        <div id="workout-list"></div>
      </div>
    </section>

    <!-- 📊 チャート画面 -->
    <section id="view-chart" class="view-section">
      <h2>📊 トレーニング分析</h2>
      <div class="chart-controls">
        <select id="chart-part-select"></select>
        <select id="chart-exercise-select"></select>
      </div>
      <div class="chart-container">
        <canvas id="weightChart"></canvas>
      </div>
      <div id="chart-summary" class="chart-summary"></div>
    </section>

    <!-- ⚙️ 設定画面 -->
    <section id="view-settings" class="view-section">
      <h2>⚙️ 設定</h2>
      
      <div class="setting-group">
        <h3>💾 データのバックアップと復元</h3>
        <p class="setting-desc">データをJSON形式で保存・読み込みします。</p>
        <div class="setting-buttons">
          <button id="btn-export" class="btn-primary">データ書き出し (JSON)</button>
          <label class="btn-secondary">
            データ読み込み
            <input type="file" id="import-file" accept=".json" style="display:none;">
          </label>
        </div>
      </div>

      <div class="setting-group">
        <h3>🏋️ 種目・部位のカスタム</h3>
        <div class="add-custom-form">
          <select id="custom-part-select"></select>
          <input type="text" id="custom-exercise-input" placeholder="新しい種目名を入力">
          <button id="btn-add-exercise" class="btn-primary">追加</button>
        </div>
        <ul id="custom-exercise-list" class="custom-list"></ul>
      </div>
    </section>
  </main>

  <!-- ボトムナビゲーション -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-target="view-calendar">📅 カレンダー</button>
    <button class="nav-btn" data-target="view-chart">📊 チャート</button>
    <button class="nav-btn" data-target="view-settings">⚙️ 設定</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
