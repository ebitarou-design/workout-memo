<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Workout-memo</title>

  <!-- PWA / iOS Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Workout-memo">
  <link rel="apple-touch-icon" href="https://via.placeholder.com/192.png?text=Workout">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- トップヘッダー -->
  <header class="app-header">
    <button class="icon-btn" id="user-btn" aria-label="ユーザー">
      <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
    </button>
    <h1 class="app-title">Workout-memo</h1>
    <button class="icon-btn" id="settings-toggle-btn" aria-label="設定">
      <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
    </button>
  </header>

  <!-- 設定モーダル -->
  <div id="settings-modal" class="modal hidden">
    <div class="modal-content">
      <h3>設定</h3>
      <div class="setting-item">
        <label for="timer-toggle">インターバルタイマー自動起動</label>
        <input type="checkbox" id="timer-toggle" checked>
      </div>
      <div class="setting-item">
        <label for="timer-seconds">タイマー時間</label>
        <select id="timer-seconds">
          <option value="60">60秒 (1分)</option>
          <option value="90">90秒 (1分30秒)</option>
          <option value="120" selected>120秒 (2分)</option>
          <option value="180">180秒 (3分)</option>
        </select>
      </div>
      <button id="close-settings-btn" class="close-btn">閉じる</button>
    </div>
  </div>

  <main class="main-content">
    
    <!-- カレンダーエリア -->
    <section class="calendar-card" id="calendar-card">
      <div class="calendar-header">
        <button id="prev-month">&lt;</button>
        <span id="current-month" class="month-title"></span>
        <button id="next-month">&gt;</button>
        <button id="toggle-calendar-btn" class="minimize-btn">▲ 縮小</button>
      </div>
      <div id="calendar-body">
        <div class="calendar-weekdays">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div id="calendar-days" class="calendar-days"></div>
      </div>
    </section>

    <!-- 日付表示 & コピーボタン -->
    <div class="section-divider">
      <h2 id="selected-date-text"></h2>
      <button id="copy-clipboard-btn" class="copy-btn">📋 記録をコピー</button>
    </div>

    <!-- トレーニング領域 -->
    <div id="workout-categories-container"></div>

    <!-- 部位追加フォーム -->
    <div class="add-category-wrapper">
      <select id="category-select" class="form-select">
        <option value="">-- 部位を選択 --</option>
        <option value="胸 (Chest)">■ 胸 (Chest)</option>
        <option value="背中 (Back)">■ 背中 (Back)</option>
        <option value="脚 (Legs)">■ 脚 (Legs)</option>
        <option value="肩 (Shoulders)">■ 肩 (Shoulders)</option>
        <option value="腕 (Arms)">■ 腕 (Arms)</option>
        <option value="腹 (Abs)">■ 腹 (Abs)</option>
        <option value="有酸素運動 (Cardio)">■ 有酸素運動 (Cardio)</option>
      </select>
      <button id="add-category-btn" class="action-btn-primary">部位を追加</button>
    </div>

  </main>

  <!-- 画面下部固定のインターバルタイマー -->
  <div id="floating-timer" class="floating-timer hidden">
    <div class="timer-info">
      <span>⏱ 休憩タイマー:</span>
      <span id="timer-display">02:00</span>
    </div>
    <button id="stop-timer-btn" class="timer-btn">スキップ</button>
  </div>

  <!-- ボトムナビ -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z"/></svg>
      <span>カレンダー</span>
    </a>
    <a href="#" class="nav-item">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zM16.2 13H19v6h-2.8z"/></svg>
      <span>チャート</span>
    </a>
    <a href="#" class="nav-item" id="nav-settings">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      <span>設定</span>
    </a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
